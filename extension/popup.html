<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>PhishGraph</h1>
    <span id="backend" class="dot" title="Backend status"></span>
  </header>

  <main>
    <div id="host" class="host"></div>
    <div id="card" class="card hidden">
      <div class="row">
        <span id="verdict" class="verdict"></span>
        <span id="prob" class="prob"></span>
      </div>
      <div class="meter"><div id="bar"></div></div>
      <div id="parts" class="parts"></div>
      <h3>Why</h3>
      <ul id="reasons"></ul>
      <div id="infra" class="infra"></div>
    </div>
    <div id="message" class="message"></div>
  </main>

  <footer>
    <button id="scan" class="primary">Scan this page</button>
    <button id="report" class="secondary hidden">Report mistake</button>
    <a id="options" href="#">Settings</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
