<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PhishGraph settings</title>
  <style>
    body { font: 14px/1.5 system-ui, "Segoe UI", Arial, sans-serif; max-width: 620px; margin: 30px auto; padding: 0 16px; color: #1f2937; }
    label { display: block; font-weight: 600; margin-top: 18px; }
    input[type=text] { width: 100%; padding: 8px; font-size: 14px; margin-top: 4px; }
    button { margin-top: 10px; padding: 8px 14px; font: 600 14px system-ui; cursor: pointer; }
    .muted { color: #6b7280; font-size: 13px; font-weight: 400; }
    #status { margin-left: 8px; }
    li { margin: 4px 0; } li button { margin: 0 0 0 8px; padding: 2px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>PhishGraph settings</h2>

  <label>Backend URL
    <input id="backend" type="text" placeholder="http://127.0.0.1:8000">
    <span class="muted">Where the PhishGraph API runs. Local: http://127.0.0.1:8000 (see README).</span>
  </label>

  <label><input id="autoScan" type="checkbox"> Automatically scan login and payment pages
    <span class="muted"><br>When off, pages are only checked when you click “Scan this page”.</span>
  </label>

  <button id="save">Save</button><button id="test">Test connection</button><span id="status"></span>

  <label>Sites you marked as trusted</label>
  <ul id="ignored"></ul>

  <p class="muted">Privacy: PhishGraph sends the page address (without the #fragment) and numeric page statistics
    (counts of forms, links, etc.) to your backend. It never sends page text, HTML, or anything you type.
    The world's top 10,000 sites are recognised locally and never sent.</p>
  <script src="options.js"></script>
</body>
</html>
